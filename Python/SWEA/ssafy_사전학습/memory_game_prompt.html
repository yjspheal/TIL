<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎉 SSAFY목표 기억력 게임</title>
  <style>
    body {
      background-color: #b2f2bb; /* 연한 민트 */
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-top: 10px;
    }
    #game {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
    }
    .card {
      width: 100px;
      height: 100px;
      background-color: #fce1e4; /* 파스텔 핑크톤 */
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .flipped {
      background-color: white;
      cursor: default;
    }
    #startBtn {
      padding: 10px 20px;
      background-color: #74c0fc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #startBtn:hover {
      background-color: #4dabf7;
    }
  </style>
</head>
<body>

  <h1>🎉 SSAFY목표 기억력 게임</h1>
  <button id="startBtn">게임 시작</button>
  <div id="game"></div>

  <script>
    const centerText = '14기 파이팅❤️‍🔥';
    const goals = ['알고리즘 향상', '1학기 성적우수', '취뽀하기', 'B형취득'];
    let cardTexts = [...goals, ...goals];
    let first = null, second = null;
    let lock = false;
    let matchedPairs = 0;

    const gameBoard = document.getElementById('game');
    const startBtn = document.getElementById('startBtn');

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function createBoard() {
      gameBoard.innerHTML = '';
      shuffle(cardTexts);
      let index = 0;

      for (let i = 0; i < 9; i++) {
        const card = document.createElement('div');
        card.className = 'card';

        if (i === 4) {
          card.textContent = centerText;
          card.classList.add('flipped');
        } else {
          card.dataset.text = cardTexts[index++];
          card.textContent = card.dataset.text;
          card.classList.add('flipped');
          card.addEventListener('click', handleCardClick);
        }

        gameBoard.appendChild(card);
      }
    }

    function handleCardClick(e) {
      const card = e.target;

      if (lock || card.classList.contains('matched') || card === first) return;

      card.classList.add('flipped');
      card.textContent = card.dataset.text;

      if (!first) {
        first = card;
      } else {
        second = card;
        lock = true;

        if (first.dataset.text === second.dataset.text) {
          first.classList.add('matched');
          second.classList.add('matched');
          matchedPairs++;
          resetTurn();

          if (matchedPairs === 4) {
            setTimeout(() => {
              alert('SSAFY가 목표를 이룰 수 있도록 항상 응원하겠습니다.❤️');
            }, 500);
          }
        } else {
          setTimeout(() => {
            first.textContent = '';
            second.textContent = '';
            first.classList.remove('flipped');
            second.classList.remove('flipped');
            resetTurn();
          }, 1000);
        }
      }
    }

    function resetTurn() {
      first = null;
      second = null;
      lock = false;
    }

    startBtn.addEventListener('click', () => {
      matchedPairs = 0;
      createBoard();

      setTimeout(() => {
        const cards = document.querySelectorAll('.card:not(.flipped)');
        cards.forEach(card => {
          card.textContent = '';
          card.classList.remove('flipped');
        });
      }, 3000);
    });
  </script>
</body>
</html>
